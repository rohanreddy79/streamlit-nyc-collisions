name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app.py
      - run: python scripts/make_sample_csv.py
      - name: Start the app headless on the synthetic CSV and check that / answers 200
        run: |
          streamlit run app.py --server.headless true --server.port 8501 --browser.gatherUsageStats false > streamlit.log 2>&1 &
          echo $! > streamlit.pid
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "HTTP $code after ${i}s"
          cat streamlit.log
          kill "$(cat streamlit.pid)"
          test "$code" = "200"
      - run: python -m pytest -q tests
